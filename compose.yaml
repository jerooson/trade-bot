services:
  listener:
    build: .
    command: ["python", "-u", "-m", "bot.listener"]
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    volumes:
      - ./logs:/app/logs

  executor:
    build: .
    command: ["python", "-u", "-m", "bot.executor"]
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      EXECUTOR_MODE: DRY_RUN
    volumes:
      - ./logs:/app/logs

  api:
    build: .
    command:
      [
        "uvicorn",
        "server.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8787",
        "--no-access-log",
      ]
    restart: unless-stopped
    user: "1000:1000"
    environment:
      HOME: /home/deploy
    volumes:
      - ./logs:/app/logs:ro
      - ./state:/app/state
      - /usr/local/lib/node_modules:/usr/local/lib/node_modules:ro
      - /home/deploy/.codex:/home/deploy/.codex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional: headless IB Gateway for BROKER=ibkr (paper). Start with
  #   docker compose --profile ibkr up -d ib-gateway
  # See docs/ibkr-paper.md.
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    profiles: ["ibkr"]
    restart: unless-stopped
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      READ_ONLY_API: "no"
      TWOFA_TIMEOUT_ACTION: restart
    ports:
      - "127.0.0.1:4002:4004"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
